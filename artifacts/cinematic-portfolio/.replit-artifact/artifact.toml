kind = "web"
previewPath = "/"
title = "Cinematic Personal Portfolio"
description = "A cinematic, scroll-driven 3D portfolio for a student and creative developer, with editable personal details, projects, academic highlights, and contact links."
version = "1.0.0"
id = "artifacts/cinematic-portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20751

[services.development]
run = "pnpm --filter @workspace/cinematic-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cinematic-portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/cinematic-portfolio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20751"
BASE_PATH = "/"
